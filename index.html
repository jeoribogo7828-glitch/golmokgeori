<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:radial-gradient(circle at 8% 13%,#f3e7d6 0,transparent 25%),radial-gradient(circle at 90% 30%,#e5f1e5 0,transparent 33%),#f8f7f0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e7aa67;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}a{color:#336c61}h1,h2,h3,p{margin-top:0}.shell{max-width:1110px;margin:0 auto;padding:0 22px}.masthead{padding:30px 0 16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:13px;letter-spacing:.09em;color:#62816d;font-weight:850}.saved{font-size:12px;color:#64806a;background:white;border:1px solid var(--line);border-radius:99px;padding:8px 11px}.hero{position:relative;overflow:hidden;margin-top:16px;background:linear-gradient(115deg,#d8ebd5,#f9e8d4 75%,#f6d9cc);border:2px solid white;border-radius:30px;box-shadow:var(--shadow);padding:32px 35px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;min-height:220px}.hero h1{font-size:clamp(34px,4.3vw,57px);letter-spacing:-.055em;margin:4px 0 11px;color:#325a4c}.hero p{font-weight:650;color:#567266;line-height:1.65;margin:0}.buildings{font-size:clamp(39px,6vw,76px);text-align:right;white-space:nowrap;filter:drop-shadow(0 7px 0 rgba(80,113,84,.13));letter-spacing:-.12em;line-height:1.4}.tiny-stars{font-size:17px;letter-spacing:.2em;color:#d7a96a}.road{margin:-5px -35px -32px;height:22px;background:#d4d8bb;grid-column:1/-1;z-index:1;border-top:4px dashed #fffdf4}.main{padding-bottom:65px}.statusrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:23px 0 12px}.statusrow strong{color:var(--green-dark)}.small{font-size:13px;color:var(--muted);line-height:1.6}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 20px}.step{border:1px solid #dbe6d9;background:#fffdfa;border-radius:16px;min-height:72px;padding:11px 8px;color:#718174;text-align:center;font-size:13px;font-weight:800;transition:.2s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}.step .circle{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#edf1e9;font-size:12px}.step.active{border:2px solid #5c977b;background:#edf5e7;color:#31634a;box-shadow:0 3px 0 #d2e6d1}.step.active .circle{background:var(--green);color:white}.step.done .circle{background:#cde8d4;color:#3a7056}.panel{border:1px solid #e4e5d8;background:var(--white);box-shadow:var(--shadow);border-radius:26px;padding:30px 32px;min-height:280px}.panelhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:17px}.panel h2{font-size:clamp(23px,2.4vw,30px);letter-spacing:-.035em;margin:0 0 6px}.sticker{font-size:13px;font-weight:850;color:#98664d;background:#ffeadf;padding:8px 12px;border-radius:99px;white-space:nowrap}.lede{color:#67766a;line-height:1.75;margin:0 0 22px}.label{display:block;font-weight:850;font-size:14px;margin:12px 0 8px}.input,select,textarea{display:block;width:100%;padding:14px 15px;border:1.5px solid #d8e0d6;background:#fffefa;border-radius:13px;color:#34483e;outline:0;line-height:1.6;transition:.15s}textarea{min-height:85px;resize:vertical}input::placeholder,textarea::placeholder{color:#9aa69b}input:focus,textarea:focus,select:focus{border-color:#669e7b;box-shadow:0 0 0 3px #deefe2}.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}.shop{border:2px solid #e6e9dc;border-radius:20px;background:#fffdf8;padding:21px 9px 18px;display:flex;flex-direction:column;align-items:center;gap:7px;min-height:137px;color:#52675c;transition:transform .13s,border-color .13s,background .13s}.shop:hover{transform:translateY(-3px);border-color:#a9cbb2}.shop.sel{border-color:#679d7a;background:#eaf4e8;box-shadow:inset 0 0 0 :#6b8270;min-height:46px;line-height:1.6}.chosen-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.choicecard,.planrow{background:#fcfcf7;border:1px solid #e6e8d9;border-radius:19px;padding:18px}.choicecard h3{margin:0 0 10px;color:#4d705a;font-size:16px}.choicecard .selectedname{font-size:24px;font-weight:850;color:#496b54}.choicecard .meaning{font-size:13px;color:#708374;line-height:1.6;margin:10px 0}.choicecard textarea{min-height:103px}.planrow{margin:12px 0}.planrow h3{font-size:19px;color:#496e57;margin:0 0 10px}.planrow select{margin-bottom:6px}.planrow textarea{min-height:95px}.inlineword{display:inline-block;background:#e9f3e8;border-radius:40px;padding:3px 10px;font-size:14px;color:#3b6a4c;margin:0 5px 5px 0;font-weight:800}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cta{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:0;background:#547f66;color:white;border-radius:13px;padding:14px 20px;font-weight:850;transition:.14s;box-shadow:0 3px 0 #3b5f4b}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn.secondary{background:#eef4ed;color:#52715c;box-shadow:none;border:1px solid #ccdfce}.btn.soft{background:#fff3e7;color:#936b4c;box-shadow:none;border:1px solid #f1dec8}.btn.danger{background:#fff6f2;color:#ad6959;box-shadow:none;border:1px solid #f0d7d0}.footline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 4px 0;font-size:12px;color:#839083}.footline button{border:none;background:none;text-decoration:underline;color:#7b8880;padding:6px}.error{border:1px solid #eed1c5;background:#fff1ec;color:#a04f3e;padding:12px 16px;border-radius:13px;margin-top:12px;font-size:14px;line-height:1.6}.summary{background:linear-gradient(140deg,#f0f6e9,#fff8ed);border:2px solid white;border-radius:23px;padding:25px;margin-bottom:17px}.summary h3{font-size:28px;color:#355e49;margin:0 0 6px}.bigicon{font-size:40px}.summary .slogan{font-size:19px;font-weight:800;color:#6b7355}.summary .intro{line-height:1.8}.summary .chunks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.summary .chunk{background:#fffefb;border:1px solid #e8e9d9;border-radius:12px;padding:12px;line-height:1.65}.summary .chunk strong{display:block;color:#4e745b;margin:0 0 5px}.boxlist{background:#fff;border:1px solid #ebeddf;border-radius:18px;padding:19px;margin-top:14px}.boxlist h3{color:#4a7159}.boxlist p{margin:6px 0;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.flag{font-size:12px;font-weight:850;color:#92765e;background:#fff2e5;border-radius:30px;padding:6px 10px}.reviewlist{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reviewitem{border:1px solid #e1e9db;background:#f5f9f1;padding:12px;border-radius:12px;font-size:14px}.reviewitem b{display:block;margin-bottom:4px}.muted{color:var(--muted)}.empty{border:1px dashed #decdb7;background:#fffaf2;border-radius:16px;padding:23px;text-align:center;color:#85745e}.footer-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.printpage{display:none}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:580px){.shell{padding:0 12px}.hero{grid-template-columns:1fr;padding:25px 18px 0}.hero h1{font-size:34px}.buildings{font-size:44px;text-align:right;line-height:1.3}.road{margin:4px -18px 0}.steps{gap:5px}.step{font-size:11px;min-height:67px;padding:7px 2px}.step .circle{width:20px;height:20px}.panel{padding:20px 16px}.panelhead{gap:8px}.sticker{font-size:11px}.shopgrid{grid-template-columns:repeat(2,1fr);gap:9px}.shop{min-height:120px;padding:12px 6px}.wordgrid,.chosen-wrap,.pickgrid,.twocol,.reviewlist{grid-template-columns:1fr}.summary .chunks{grid-template-columns:1fr}.cta .btn{flex:1}.statusrow{align-items:flex-start}}

<body>
<header class="masthead"><div class="shell"><div class="topline"><span class="eyebrow">🌱 6학년 4반 · 우리말 프로젝트</span><span class="saved" id="saved">💾 이 기기에 자동 저장돼요</span></div><div class="hero"><div><div class="tiny-stars">✦ ✿ ✦</div><h1>6-4 골목거리</h1><p>고유어를 발견하고, 우리만의 공간을 소개해요!<br>작은 낱말이 모여 특별한 골목이 됩니다. ♡</p></div><div class="buildings" aria-hidden="true">🏡 🌷 📚<br>🍚 🛝 🌳</div><div class="road"></div></div></div></header>
<main class="shell main"><div class="statusrow"><strong id="status">STEP 1 · 공간 선택</strong><span class="small">🌼 한 단계씩 천천히! 작성 내용은 같은 브라우저에 저장됩니다.</span></div><nav class="steps" id="steps" aria-label="활동 단계"></nav><div id="content" aria-live="polite"></div><div class="cta" id="actions"></div><div class="footline"><span>🎈 우리말샘을 열려면 인터넷이 필요해요. 선생님께 결과가 자동 제출되지는 않아요.</span><div><button id="backup" type="button">기록 백업하기</button><button id="restore" type="button">백업 불러오기</button><button id="reset" type="button">처음부터 다시</button></div></div><input type="file" accept="application/json,.json" id="restoreFile" class="sr-only"></main>
<div class="printpage shell" id="printpage"></div>
<script>
'use strict';
const PLACES=[
{id:'flower',name:'꽃집',emoji:'💐',words:['꽃망울','꽃송이','꽃다발','꽃씨','싱그럽다','활짝']},
{id:'clothes',name:'옷가게',emoji:'👕',words:['옷감','옷차림','옷매무새','옷자락','알록달록','보드랍다']},
{id:'book',name:'책방',emoji:'📚',words:['글쓴이','줄거리','읽을거리','이야기','꿈꾸다','속삭이다']},
{id:'food',name:'음식점',emoji:'🍚',words:['누룽지','밥상','군침','구수하다','푸짐하다','보글보글']},
{id:'play',name:'놀이터',emoji:'🛝',words:['그네','미끄럼틀','숨바꼭질','술래잡기','뛰놀다','깔깔거리다']},
{id:'rest',name:'쉼터',emoji:'🌳',words:['햇살','오솔길','바람결','도란도란','포근하다','느긋하다']},
{id:'demo',name:'도서관',emoji:'🏫',words:['배움','생각','이야기','글쓴이','꿈꾸다','읽을거리'],teacher:true}
];
const STAGES=['공간 선택','뜻 조사','3개 선택','전단지 계획','계획서 확인'];
const KEY='golmokgeori_2026_final_v1';
const fresh=()=>({version:1,step:0,place:'',team:'',meanings:{},selected:[],reasons:{},roles:{},phrases:{},picture:'',pictureReason:''});
let d=fresh();
try{let raw=localStorage.getItem(KEY);if(raw){let val=JSON.parse(raw);if(val&&val.version===1&&typeof val==='object'){d={...fresh(),...val};if(!Array.isArray(d.selected))d.selected=[];for(let k of ['meanings','reasons','roles','phrases'])if(!d[k]||typeof d[k]!=='object'||Array.isArray(d[k]))d[k]={};d.step=Math.max(0,Math.min(4,Number(d.step)||0));}}}catch(e){}
const $=id=>document.getElementById(id);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const place=()=>PLACES.find(s=>s.id===d.place);
function save(){try{localStorage.setItem(KEY,JSON.stringify(d));$('saved').textContent='✓ 자동 저장됨';}catch(e){$('saved').textContent='⚠ 저장 불가 · 백업을 사용하세요';}}
function txt(v){return typeof v==='string'?v.trim():''}
function download(text,name,mime){let blob=new Blob([text],{type:mime});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function fileBase(){return ('6-4_골목거리_'+(txt(d.team)||place()?.name||'계획서')).replace(/[\\/:*?"<>|]/g,'_')}
function announce(msg){let old=$('error');if(old)old.remove();if(!msg)return;let node=document.createElement('div');node.className='error';node.id='error';node.setAttribute('role','alert');node.textContent='💡 '+msg;$('actions').before(node);node.scrollIntoView({block:'nearest',behavior:'smooth'})}
function validate(stage){const s=place();if(stage===0){if(!s)return '우리 모둠이 맡은 공간을 선택해 주세요.';return '';}if(!s)return '먼저 공간을 선택해 주세요.';if(stage===1){let missing=s.words.filter(w=>!txt(d.meanings[w]));return missing.length?`${missing.join(', ')}의 뜻을 찾아 적어 주세요. (남은 단어 ${missing.length}개)`:'';}if(stage===2){if(d.selected.length!==3)return '서로 다른 고유어 3개를 선택해 주세요.';let missing=d.selected.filter(w=>!txt(d.reasons[w]));return missing.length?`${missing.join(', ')}을/를 선택한 이유를 적어 주세요.`:'';}if(stage===3){if(d.selected.length!==3)return '먼저 고유어 3개를 선택해 주세요.';let roles=d.selected.map(w=>d.roles[w]);if(roles.some(x=>!x))return '선택한 세 단어를 어디에 활용할지 각각 정해 주세요.';if(new Set(roles).size!==3)return '세 고유어를 이름, 홍보 문구, 소개 문장에 하나씩 배치해 주세요.';let missing=d.selected.filter(w=>!txt(d.phrases[w]));if(missing.length)return `${missing.join(', ')}을/를 활용한 전단지 표현을 작성해 주세요.`;if(!txt(d.picture))return '전단지에 들어갈 그림이나 사진을 계획해 주세요.';if(!txt(d.pictureReason))return '그 그림이나 사진을 넣는 이유를 적어 주세요.';return '';}return ''}
function stepTo(i){d.step=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function title(n,name,stamp){return `<div class="panelhead"><div><h2>${n}. ${name}</h2></div><span class="sticker">${stamp}</span></div>`}
function step0(){return `<section class="panel">${title('01','우리 모둠의 공간을 골라요','🏡 반가워요!')}<p class="lede">선생님과 정한 가게나 시설을 선택해요. 도서관은 선생님이 보여 주는 연습 공간이에요.</p><label class="label" for="team">우리 모둠 이름 <span class="small">(선택)</span></label><input class="input" id="team" placeholder="예: 1모둠 / 무지개 모둠" maxlength="40" value="${escapeHtml(d.team)}"><h3 style="margin:24px 0 9px">어떤 공간을 맡았나요?</h3><div class="shopgrid">${PLACES.map(s=>`<button type="button" class="shop ${d.place===s.id?'sel':''}" data-place="${s.id}" aria-pressed="${d.place===s.id}"><span class="em" aria-hidden="true">${s.emoji}</span><strong>${s.name}</strong>${s.teacher?'<span class="sub">선생님 연습용</span>':''}</button>`).join('')}</div><div class="notice mint">🌿 <b>오늘의 임무</b><br>우리 공간과 어울리는 고유어를 찾고, 세 단어를 골라 전단지를 계획해요. 가게 이름이나 홍보 문구는 우리가 직접 만들 거예요!</div></section>`}
function step1(){const s=place();if(!s)return empty();const count=s.words.filter(w=>txt(d.meanings[w])).length;return `<section class="panel">${title('02',`${s.emoji} ${escapeHtml(s.name)}의 고유어를 조사해요`,'🔎 낱말 탐험')}<p class="lede">우리말샘에서 <b>여섯 단어를 모두</b> 찾아보세요. 검색 결과가 여러 개라면 <b>우리 공간에 어울리는 뜻</b>을 골라 적어요. 사전의 용례는 따로 적지 않아도 돼요!</p><a href="https://opendict.korean.go.kr/" target="_blank" rel="noopener noreferrer" class="dictionary-link">📖 우리말샘 사전 열기 ↗</a><div class="notice">💡 <b>찾는 방법</b><br>① 단어를 검색해요 → ② 여러 뜻을 살펴봐요 → ③ 우리 공간에서 활용하고 싶은 뜻을 찾아 간단히 기록해요.<br>※ 방언·지명·같은 소리의 다른 단어가 나오면, 찾는 단어와 뜻이 맞는지 확인해요.</div><span class="pill">🌱 ${count} / 6개 조사했어요</span><div class="progress" role="progressbar" aria-label="조사 진행률" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${count}"><div style="width:${count/6*100}%"></div></div><div class="wordgrid">${s.words.map((w,i)=>`<article class="wordcard"><div class="wordtop"><h3>${i+1}. ${escapeHtml(w)}</h3><span class="wordtag">${txt(d.meanings[w])?'✓ 기록 완료':'뜻 찾기'}</span></div><label class="label" for="meaning${i}">우리 공간에 어울리는 뜻</label><textarea id="meaning${i}" data-meaning="${escapeHtml(w)}" placeholder="우리말샘에서 찾아 적어 보세요. 예: 우리 공간에서 쓸 뜻을 간단히 적기">${escapeHtml(d.meanings[w]||'')}</textarea><p class="fieldhelp">사전에 여러 뜻이 있다면, 우리 공간에 가장 어울리는 뜻을 골라요.</p></article>`).join('')}</div></section>`}
function step2(){const s=place();if(!s)return empty();return `<section class="panel">${title('03','우리 공간의 고유어 3개를 골라요','🌼 고유어 고르기')}<p class="lede">조사한 여섯 단어 중 전단지에 쓰고 싶은 <b>서로 다른 고유어 3개</b>를 선택해요. 이름에 쓸지, 홍보 문구에 쓸지는 다음 단계에서 정하니 자유롭게 골라 보세요!</p><span class="pill">💚 ${d.selected.length} / 3개 선택했어요</span><div class="pickgrid">${s.words.map(w=>`<div class="pickword ${d.selected.includes(w)?'active':''}"><div class="wd">${escapeHtml(w)}</div><div class="meaning">${escapeHtml(txt(d.meanings[w])||'뜻을 아직 적지 않았어요.')}</div><button type="button" data-toggle="${escapeHtml(w)}" aria-pressed="${d.selected.includes(w)}">${d.selected.includes(w)?'✓ 선택했어요':'＋ 이 단어 선택'}</button></div>`).join('')}</div><h3 style="margin-top:26px">선택한 이유를 적어 볼까요?</h3>${d.selected.length?`<div class="chosen-wrap">${d.selected.map((w,i)=>`<div class="choicecard"><h3>선택한 고유어 ${i+1}</h3><div class="selectedname">${escapeHtml(w)}</div><p class="meaning">뜻: ${escapeHtml(d.meanings[w]||'미작성')}</p><label class="label" for="reason${i}">이 단어를 고른 이유</label><textarea id="reason${i}" data-reason="${escapeHtml(w)}" placeholder="이 단어가 우리 공간에 어울리는 이유를 써 보세요.">${escapeHtml(d.reasons[w]||'')}</textarea></div>`).join('')}</div>`:'<div class="empty">먼저 위에서 마음에 드는 단어를 눌러 주세요! 🌷</div>'}<div class="notice mint">✦ <b>생각해 볼 질문</b> : 이 단어는 우리 공간의 어떤 특징을 잘 보여 주나요?</div></section>`}
const ROLES=[{id:'name',name:'공간 이름',hint:'예: 우리말로 만든 가게·시설의 이름'},{id:'slogan',name:'홍보 문구 또는 상품·서비스 이름',hint:'예: 손님에게 전하고 싶은 말, 특별한 메뉴 이름'},{id:'intro',name:'공간 소개 문장',hint:'예: 우리 공간에서 무엇을 할 수 있는지 소개'}];
function step3(){const s=place();if(!s)return empty();return `<section class="panel">${title('04','홍보 전단지를 계획해요','🎨 설레는 준비')}<p class="lede">선택한 고유어 3개를 <b>공간 이름 · 홍보 문구 · 공간 소개</b>에 하나씩 자유롭게 배치해요. 그다음 전단지에 실제로 넣을 표현을 완성하고 그림도 계획해요.</p>${d.selected.map((w,i)=>`<div class="planrow"><h3><span class="inlineword">${escapeHtml(w)}</span> 이 단어를 어떻게 사용할까요?</h3><p class="small">고유어의 뜻: ${escapeHtml(d.meanings[w]||'미작성')}<br>선택 이유: ${escapeHtml(d.reasons[w]||'미작성')}</p><label class="label" for="role${i}">활용할 위치 선택</label><select id="role${i}" data-role="${escapeHtml(w)}"><option value="">어디에 넣을지 골라요</option>${ROLES.map(r=>`<option value="${r.id}" ${d.roles[w]===r.id?'selected':''}>${r.name}</option>`).join('')}</select><p class="fieldhelp">${escapeHtml(ROLES.find(r=>r.id===d.roles[w])?.hint||'세 단어의 활용 위치는 서로 다르게 골라요.')}</p><label class="label" for="phrase${i}">전단지에 실제로 넣을 표현</label><textarea id="phrase${i}" data-phrase="${escapeHtml(w)}" placeholder="선택한 고유어를 넣어 이름이나 문장을 만들어 보세요.">${escapeHtml(d.phrases[w]||'')}</textarea></div>`).join('')}<div class="planrow"><h3>🖼️ 그림이나 사진도 계획해요</h3><div class="twocol"><div><label class="label" for="picture">어떤 그림이나 사진을 넣을까요?</label><textarea id="picture" placeholder="예: 활짝 피어난 꽃을 담은 그림">${escapeHtml(d.picture)}</textarea></div><div><label class="label" for="pictureReason">왜 그 그림을 넣고 싶나요?</label><textarea id="pictureReason" placeholder="예: '꽃망울'이 피어나는 모습을 보여 주기 위해">${escapeHtml(d.pictureReason)}</textarea></div></div></div><div class="notice mint">🎨 캔바에서 전단지를 만들 때는 여기서 정한 표현과 그림을 활용해요. <b>고유어의 뜻도 보는 사람이 알 수 있도록</b> 나타내면 좋아요!</div></section>`}
function summaryData(){const s=place();const items=ROLES.map(r=>{let word=d.selected.find(w=>d.roles[w]===r.id)||'';return {...r,word,expression:word?d.phrases[word]||'':''}});return {s,items}}
function summaryHtml(){const {s,items}=summaryData();const exp=id=>items.find(x=>x.id===id)?.expression||'';return `<section class="summary"><div class="bigicon" aria-hidden="true">${s.emoji}</div><div class="small">${escapeHtml(d.team||'우리 모둠')} · ${escapeHtml(s.name)} 홍보 전단지 계획</div><h3>${escapeHtml(exp('name')||'우리 공간 이름을 지어 주세요')}</h3><p class="slogan">${escapeHtml(exp('slogan')||'홍보 문구를 만들어 주세요')}</p><p class="intro">${escapeHtml(exp('intro')||'공간 소개 문장을 작성해 주세요')}</p><div class="chunks">${d.selected.map(w=>`<div class="chunk"><strong>🌱 ${escapeHtml(w)}</strong>${escapeHtml(d.meanings[w]||'뜻 미작성')}</div>`).join('')}</div><div class="small">🖼️ 그림 계획: ${escapeHtml(d.picture||'미작성')}</div></section><section class="boxlist"><h3>📝 우리가 선택한 이유</h3>${d.selected.map(w=>`<p><b>${escapeHtml(w)}</b> — ${escapeHtml(d.reasons[w]||'미작성')}</p>`).join('')}</section><section class="boxlist"><h3>🗺️ 홍보 전단지 표현 계획</h3>${items.map(r=>`<p><b>${escapeHtml(r.name)}:</b> ${escapeHtml(r.expression||'미작성')} <span class="small">(${escapeHtml(r.word||'미선택')})</span></p>`).join('')}<p><b>그림·사진 계획:</b> ${escapeHtml(d.picture||'미작성')}</p><p><b>그림을 넣는 이유:</b> ${escapeHtml(d.pictureReason||'미작성')}</p></section>`}
function step4(){const s=place();if(!s)return empty();const missing=[0,1,2,3].map(i=>validate(i)).filter(Boolean);return `<section class="panel">${title('05','우리 모둠의 계획서를 확인해요','🎉 거의 완성!')}<p class="lede">지금까지 찾은 고유어와 전단지 계획이 한곳에 모였어요! 내용을 확인하고 <b>파일로 저장</b>하거나 <b>인쇄</b>해 보세요.</p>${missing.length?`<div class="notice">⚠ 아직 작성하지 않은 항목이 있어요. 앞 단계로 돌아가 채워 보세요.<br>${missing.map(x=>`• ${escapeHtml(x)}`).join('<br>')}</div>`:''}${summaryHtml()}<div class="footer-actions"><button type="button" class="btn" id="printBtn">🖨️ 인쇄 / PDF 저장</button><button type="button" class="btn soft" id="txtBtn">📄 계획서 TXT 저장</button><button type="button" class="btn secondary" id="backBtn">✏️ 내용 고치기</button></div><div class="notice mint">🎈 <b>기억해요!</b> 웹사이트에 접속하더라도 모둠의 입력 내용이 선생님에게 자동 전송되지는 않아요. 선생님이 안내한 방법으로 계획서를 제출해 주세요.</div></section>`}
function empty(){return '<section class="panel"><div class="empty">🏡 먼저 1단계에서 우리 공간을 선택해 주세요.</div></section>'}
function render(){const s=place();$('status').textContent=`STEP ${d.step+1} · ${STAGES[d.step]}`;$('steps').innerHTML=STAGES.map((x,i)=>`<button type="button" class="step ${d.step===i?'active':i<d.step?'done':''}" data-step="${i}" aria-current="${d.step===i?'step':'false'}"><span class="circle">${i<d.step?'✓':i+1}</span><span>${x}</span></button>`).join('');$('content').innerHTML=[step0,step1,step2,step3,step4][d.step]();$('actions').innerHTML=`<button type="button" class="btn secondary" id="prev" ${d.step===0?'disabled':''}>← 이전 단계</button>${d.step===4?'<button type="button" class="btn" id="finishBtn">🎉 계획서 인쇄하기</button>':'<button type="button" class="btn" id="next">다음 단계 →</button>'}`;renderPrint()}
function renderPrint(){const s=place();if(!s){$('printpage').innerHTML='';return;}const {items}=summaryData();$('printpage').innerHTML=`<h1>🏡 6-4 골목거리 · 고유어 홍보 전단지 계획서</h1><p>모둠: ${escapeHtml(d.team||'미입력')} / 공간: ${escapeHtml(s.name)}</p><section><h2>1. 조사한 고유어</h2><table><thead><tr><th>고유어</th><th>우리 공간에 어울리는 뜻</th></tr></thead><tbody>${s.words.map(w=>`<tr><td>${escapeHtml(w)}</td><td>${escapeHtml(d.meanings[w]||'미작성')}</td></tr>`).join('')}</tbody></table></section><section><h2>2. 선택한 고유어와 이유</h2><table><tbody>${d.selected.map(w=>`<tr><th>${escapeHtml(w)}</th><td>${escapeHtml(d.reasons[w]||'미작성')}</td></tr>`).join('')}</tbody></table></section><section><h2>3. 홍보 전단지 계획</h2><table><tbody>${items.map(r=>`<tr><th>${escapeHtml(r.name)}</th><td>${escapeHtml(r.expression||'미작성')} ${r.word?'('+escapeHtml(r.word)+')':''}</td></tr>`).join('')}<tr><th>그림·사진</th><td>${escapeHtml(d.picture||'미작성')}</td></tr><tr><th>그림 선정 이유</th><td>${escapeHtml(d.pictureReason||'미작성')}</td></tr></tbody></table></section>`}
function plainText(){const s=place();if(!s)return '';let {items}=summaryData();return ['6-4 골목거리 | 우리 모둠의 고유어 전단지 계획서',`모둠: ${d.team||'미입력'}`,`공간: ${s.name}`,'','[1. 고유어 조사]',...s.words.map(w=>`${w} : ${d.meanings[w]||'미작성'}`),'','[2. 고유어 선택과 이유]',...d.selected.map(w=>`${w} : ${d.reasons[w]||'미작성'}`),'','[3. 홍보 전단지 계획]',...items.map(r=>`${r.name} (${r.word||'미선택'}) : ${r.expression||'미작성'}`),`그림·사진: ${d.picture||'미작성'}`,`그림 선정 이유: ${d.pictureReason||'미작성'}`].join('\n')}
// Delegated handlers keep textareas stable as students type; the whole page is not redrawn per keystroke.
document.addEventListener('input',e=>{const t=e.target;if(t.id==='team'){d.team=t.value;save();return;}let k=t.dataset;if(k.meaning){d.meanings[k.meaning]=t.value;save();return;}if(k.reason){d.reasons[k.reason]=t.value;save();return;}if(k.phrase){d.phrases[k.phrase]=t.value;save();return;}if(t.id==='picture'||t.id==='pictureReason'){d[t.id]=t.value;save();}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.role){d.roles[t.dataset.role]=t.value;save();render();return;}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.step!==undefined){const n=Number(t.dataset.step);if(n>d.step){for(let i=0;i<n;i++){const err=validate(i);if(err){announce(err);return;}}}stepTo(n);return;}
if(t.dataset.place){if(d.place!==t.dataset.place){if(d.place&&(Object.keys(d.meanings).some(w=>txt(d.meanings[w]))||d.selected.length||txt(d.picture))&&!confirm('공간을 바꾸면 기존 조사·계획 내용이 초기화돼요. 다른 공간으로 바꿀까요?'))return;d.place=t.dataset.place;d.meanings={};d.selected=[];d.reasons={};d.roles={};d.phrases={};d.picture='';d.pictureReason='';save();render()}return;}
if(t.dataset.toggle){const word=t.dataset.toggle;if(d.selected.includes(word)){d.selected=d.selected.filter(w=>w!==word);delete d.roles[word];delete d.phrases[word];}else if(d.selected.length<3){d.selected.push(word)}else{announce('고유어는 3개까지만 고를 수 있어요. 다른 단어를 선택하려면 하나를 해제해 주세요.');return;}save();render();return;}
if(t.id==='prev')stepTo(Math.max(0,d.step-1));if(t.id==='next'){const err=validate(d.step);if(err)announce(err);else stepTo(Math.min(4,d.step+1));}if(t.id==='finishBtn'||t.id==='printBtn'){renderPrint();window.print();}
if(t.id==='txtBtn')download(plainText(),fileBase()+'.txt','text/plain;charset=utf-8');if(t.id==='backBtn')stepTo(3);
if(t.id==='backup')download(JSON.stringify(d,null,2),fileBase()+'_백업.json','application/json;charset=utf-8');
if(t.id==='restore')$('restoreFile').click();
if(t.id==='reset'){if(confirm('정말 처음부터 다시 시작할까요? 이 기기에 저장된 내용이 삭제됩니다.')){d=fresh();save();render();window.scrollTo({top:0,behavior:'smooth'})}}
});
$('restoreFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let val=JSON.parse(await f.text());if(!val||val.version!==1||!PLACES.some(s=>s.id===val.place))throw Error('형식이 다른 파일이에요.');if(!confirm('백업 내용을 불러오면 현재 작성 내용이 덮어써집니다. 계속할까요?'))return;const clean=fresh();d={...clean,...val,step:Math.min(4,Math.max(0,Number(val.step)||0)),selected:Array.isArray(val.selected)?val.selected.filter(w=>PLACES.find(s=>s.id===val.place).words.includes(w)).slice(0,3):[]};for(const k of ['meanings','reasons','roles','phrases']){if(!d[k]||typeof d[k]!=='object'||Array.isArray(d[k]))d[k]={}}save();render();announce('백업 파일을 불러왔어요. 내용을 확인해 주세요.');}catch(err){announce('백업 파일을 열 수 없어요. 이 프로그램에서 저장한 JSON 파일인지 확인해 주세요.');}finally{e.target.value=''}});
render();
</script>
</body>
</html>
